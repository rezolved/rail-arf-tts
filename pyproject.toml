[project]
name = "rezolve-arf-tts"
version = "0.1.0"
description = "Rezolve TTS Research Framework — benchmark and fine-tune Kokoro-82M against ElevenLabs for voice filler synthesis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
    { name = "Rezolve", email = "margaritatiamanova@rezolve.com" },
]
keywords = [
    "ai",
    "tts",
    "text-to-speech",
    "kokoro",
    "elevenlabs",
    "research",
    "reproducibility",
    "claude-code",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.0",
    "types-tqdm>=4.67.3.20260303",
    "pymupdf>=1.27.2.2",
    "vastai>=1.0.1",
    "numpy>=2.0",
    "scipy>=1.0",
    "kokoro>=0.9",
    "elevenlabs>=1.0",
    "soundfile>=0.12",
    "pydub>=0.25",
    "matplotlib>=3.0",
    "seaborn>=0.13",
    "torch>=2.12.1",
]

[project.optional-dependencies]
speaker-sim = [
    "resemblyzer>=0.1.4",
]

[project.urls]
Homepage = "https://github.com/rezolved/rail-arf-tts"
Repository = "https://github.com/rezolved/rail-arf-tts"
Issues = "https://github.com/rezolved/rail-arf-tts/issues"
Documentation = "https://github.com/rezolved/rail-arf-tts/tree/main/arf/docs"
Company = "https://rezolve.com"

[tool.uv]
override-dependencies = [
    "cryptography>=46.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arf"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tasks/.*/code/", "tasks/.*/assets/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["arf/tests", "meta"]
python_files = "test_*.py"
python_functions = "test_*"

[dependency-groups]
dev = [
    "flowmark>=0.6.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-pyyaml",
    "scipy-stubs",
    "dvc>=3.67.1",
    "dvc-azure>=3.1.1",
]

[tool.flowmark]
width = 100
extend-exclude = [
    "overview/",
    "tasks/*/assets/dataset/*/files/",
    "tasks/*/logs/",
]
