  min_length: 50  # unknown: default from v6c
  num_workers: 16  # unknown: default from v6c
  root_path: '..'  # unknown: default from v6c
  train_data: ../data/v3/train_list_266.txt  # unknown: 266-clip list itself is unrecoverable (see data/v3_train_list_UNRECOVERED.md); this path is a naming-convention guess following v6c's own ../data/v5/train_list_250.txt pattern, not a confirmed path
  val_data: ../data/v5/val_list.txt  # unknown: default from v6c (v3 predates the v4/v5 data lineage per t0006's own description, so even this default is a weak guess -- flagged, not upgraded)
epochs: 10  # unknown: default from v6c
epochs_1st: 10  # unknown: default from v6c
epochs_2nd: 10  # inferred: audio/epoch{0..3}_phrase*.wav plus audio/v3/ep{6,7,8} and audio/v3b/ep{6,7,8,9} samples span epochs 0-9 with no gaps (confirmed directly from the DVC-pulled file listing), i.e. at least 10 epoch checkpoints were saved -- consistent with v6c's own epochs_2nd=10 value, though the two 4-epoch and 6-9-epoch sample sets may represent different runs/checkpoints resumed from different starting points (see Per-Epoch Sample Gate Scores in results/v3_checkpoint_forensics.md)
first_stage_path: first_stage_v3.pth  # confirmed: task_description.md's "What already exists" section explicitly names first_stage_v3.pth as v3's Stage 1 checkpoint, and tasks/t0006_kokoro_v5_stage2_subset/code/config_david_v6c_stage2.yml line 16 loads the identical filename. Byte-identity to the local stage1/first_stage.pth (SHA-256 8a3375e306bc5a7522e21bd996ed9317ea1bb7ebbafc99a8e485a4263803bcac) could NOT be confirmed: the VM's ~/kokoro-finetune is t0014's own later clone (see data/vm_inventory/inventory.json), not a preserved v3-era environment, and no first_stage_v3.pth was found anywhere on the VM or its persistent /mnt/cache/persist share.
load_only_params: true  # confirmed: CLAUDE.md's own project convention states "Always start Stage 2 from first_stage.pth with load_only_params: true"
log_dir: logs/kokoro-david-v3  # unknown: default naming convention (matches v6c's logs/kokoro-david-v6c and the VM's logs/v11/ pattern), not a confirmed path
loss_params:
  TMA_epoch: 0  # unknown: default from v6c
  diff_epoch: 999  # unknown: default from v6c
  joint_epoch: 6  # unknown: default from v6c. t0009's results/confound_table.md speculates 0 for v3 but explicitly labels it "speculated" (no evidence cited) -- not adopted here since it is no better evidenced than v6c's own value, and t0009's own analysis credits joint_epoch=6 as "the single largest contributing factor" to v6c's success.
  lambda_F0: 1.0  # unknown: default from v6c
  lambda_ce: 20.0  # unknown: default from v6c
  lambda_diff: 0.0  # unknown: default from v6c
  lambda_dur: 1.0  # unknown: default from v6c
  lambda_gen: 0.2  # unknown: default from v6c's ACTUAL committed value (config_david_v6c_stage2.yml line 27: "lambda_gen: 0.2"). t0009's results/confound_table.md claims v6c's own lambda_gen was "1.0" and separately claims v3's was "1.0 (assumed)" -- but the confound table's v6c claim is directly contradicted by v6c's own committed file, which this task verified by reading the primary source rather than trusting the secondary table. Since the confound table is demonstrably wrong about v6c's own row, its "1.0 (assumed)" claim for v3 is not trusted either; v6c's real value is carried forward as the best available default instead.
  lambda_mel: 5.0  # unknown: default from v6c
  lambda_mono: 1.0  # unknown: default from v6c
  lambda_norm: 1.0  # unknown: default from v6c
  lambda_s2s: 1.0  # unknown: default from v6c
  lambda_slm: 0.0  # inferred: tasks/t0006_kokoro_v5_stage2_subset/data/reference/v3/train_second_patch.diff's only training-loop patch wraps the entire SLM-adversarial block in "if loss_params.lambda_slm > 0:" -- upstream train_second.py ran this block unconditionally, so the patch was needed specifically to support lambda_slm<=0 without crashing, implying v3's actual run used lambda_slm<=0 (most likely exactly 0.0, matching v6c's own value, since anything >0 would not have required disabling the block)
