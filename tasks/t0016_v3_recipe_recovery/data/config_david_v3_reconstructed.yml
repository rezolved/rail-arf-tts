  multispeaker: false  # inferred: checkpoint-shape forensics on stage1/first_stage.pth's net["diffusion"] shows exactly one cross-attention conditioning pathway per transformer block, with no second, distinctly-shaped conditioning block that StyleTransformer1d's extra `context_features=style_dim*2` argument would require -- suggestive of the simpler Transformer1d branch (multispeaker=false) per models.py:808's build_model() branch (VM copy: data/vm_inventory/kokoro_finetune_current/models.py). Does NOT meet the "confirmed" bar (no launch YAML or class-source shape proof recovered) -- see "Multispeaker Resolution" in results/v3_checkpoint_forensics.md for the full three-way contradiction and this verdict's reasoning. This DIRECTLY CONTRADICTS best/config.json's own "multispeaker": true, which is treated here as a secondary, one-inference-step-removed packaged-bundle artifact, not checkpoint-level proof.
