# Reconstructed Kokoro v3 Stage 2 StyleTTS2 training config (t0016, Milestone 4 Step 15).
#
# Schema copied from tasks/t0006_kokoro_v5_stage2_subset/code/config_david_v6c_stage2.yml (the
# closest surviving relative of v3's actual launch config). Every field below carries exactly one
# provenance tag:
#   # confirmed: <file path or SHA-256>       -- a file directly states this value
#   # inferred: <reasoning>                   -- derived from checkpoint/sample/log evidence
#   # unknown: default from v6c                -- no evidence found; v6c's own value carried over
#
# See results/v3_checkpoint_forensics.md for the full evidence ledger, including the Multispeaker
# Resolution and Config Diff vs v6c and t0009 sections.

