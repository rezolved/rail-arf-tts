# Kokoro Stage 2 v11 training config.
#
# Derived from tasks/t0010_stage2_safeguarded_training/data/run_v10/config_david_v10.yml.
# Changed fields (plan.md Milestone A step 1, REQ-1/REQ-3/REQ-5):
#
#   * first_stage_path: repointed at yl4579/StyleTTS2-LibriTTS's epochs_2nd_00020.pth -- a
#     genuinely HiFi-GAN-shaped checkpoint (confirmed by this task's own tensor-level pre-flight
#     check, results/checkpoint_forensics_v11.md) -- instead of v10's first_stage_v3.pth (an
#     ISTFTNet-shaped checkpoint that silently partial-loaded into the hifigan decoder block below,
#     the root cause t0013 diagnosed). Stored under the verified persistent-disk symlink target
#     (Lesson 10), not ephemeral /mnt or /.
#   * data_params.train_data: repointed at t0012's 1,531-clip LUFS-normalized manifest instead of
#     v10's 250-clip subset. data_params.val_data is UNCHANGED (same val_96 set t0008/t0009/t0010
#     all used) -- confirmed zero overlap in results/val96_leak_check.txt.
#   * epochs / epochs_2nd: 20 -> 50. loss_params.diff_epoch: 6 -> 10. loss_params.joint_epoch:
#     8 -> 30. Anchored on StyleTTS2's own official Configs/config_ft.yml fine-tuning recipe at
#     comparable (~1k-sample) corpus scale, superseding v10's from-scratch-sized budget now that
#     the decoder is fine-tuning from real pretrained weights, not random/mismatched init. See
#     plan.md "Epoch budget (REQ-5)".
#   * log_dir: logs/v10 -> logs/v11.
#
# Everything else (batch_size, all lambda_* weights, optimizer_params, model_params,
# slmadv_params) is left unchanged from v10, per plan.md Approach section.
ASR_config: Utils/ASR/config.yml
ASR_path: Utils/ASR/epoch_00080.pth
F0_path: Utils/JDC/bst.t7
PLBERT_dir: Utils/PLBERT/
batch_size: 8
data_params:
  OOD_data: Data/OOD_texts.txt
  min_length: 50
  num_workers: 2
  root_path: ''
  train_data: data/train_list_v11_normalized.txt
  val_data: data/val_list.txt
epochs: 50
epochs_2nd: 50
first_stage_path: /mnt/cache/persist/pretrained/StyleTTS2-LibriTTS/Models/LibriTTS/epochs_2nd_00020.pth
load_only_params: true
log_dir: logs/v11
loss_params:
  diff_epoch: 10
  joint_epoch: 30
  lambda_F0: 1.0
  lambda_ce: 20.0
  lambda_diff: 1.0
  lambda_dur: 1.0
  lambda_gen: 1.0
  lambda_mel: 5.0
  lambda_mono: 1.0
  lambda_norm: 1.0
  lambda_s2s: 1.0
  lambda_slm: 0.0
  lambda_sty: 1.0
model_params:
  decoder:
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    resblock_kernel_sizes: [3, 7, 11]
    type: hifigan
    upsample_initial_channel: 512
    upsample_kernel_sizes: [20, 10, 6, 4]
    upsample_rates: [10, 5, 3, 2]
  diffusion:
    dist:
      estimate_sigma_data: true
      mean: -3.0
      sigma_data: 1.8788070678710938
      std: 1.0
    embedding_mask_proba: 0.1
    transformer:
      head_features: 64
      multiplier: 2
      num_heads: 8
      num_layers: 3
  dim_in: 64
  dropout: 0.2
  hidden_dim: 512
  max_conv_dim: 512
  max_dur: 50
  multispeaker: true
  n_layer: 3
  n_mels: 80
  n_token: 178
  slm:
    hidden: 768
    initial_channel: 64
    model: microsoft/wavlm-base-plus
    nlayers: 13
    sr: 16000
  style_dim: 128
optimizer_params:
  bert_lr: 1.0e-06
  ft_lr: 0.0001
  lr: 0.0001
preprocess_params:
  spect_params:
    hop_length: 300
    n_fft: 2048
    win_length: 1200
  sr: 24000
second_stage_load_pretrained: false
slmadv_params:
  batch_percentage: 0.5
  iter: 10
  max_len: 500
  min_len: 400
  scale: 0.01
  sig: 1.5
  thresh: 5
train_LM: false
