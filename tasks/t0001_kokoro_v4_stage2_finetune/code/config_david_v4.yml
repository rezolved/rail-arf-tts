ASR_config: Utils/ASR/config.yml
ASR_path: Utils/ASR/epoch_00080.pth
F0_path: Utils/JDC/bst.t7
PLBERT_dir: Utils/PLBERT/
batch_size: 8
data_params:
  OOD_data: ../training/OOD_texts.txt
  min_length: 50
  num_workers: 16
  root_path: '..'   # wav paths in *_list.txt are repo-root-relative; cwd is StyleTTS2/
  train_data: ../data/v4/train/train_list.txt
  val_data: ../data/v4/val/val_list.txt
epochs: 20
epochs_1st: 20
epochs_2nd: 20
first_stage_path: first_stage.pth
load_only_params: true   # fresh start from Stage 1 — weights only, no optimizer state
log_dir: logs/kokoro-david-v4
loss_params:
  TMA_epoch: 0
  diff_epoch: 999
  joint_epoch: 3
  lambda_F0: 1.0
  lambda_ce: 20.0
  lambda_diff: 0.0
  lambda_dur: 1.0
  lambda_gen: 1.0
  lambda_mel: 5.0
  lambda_mono: 1.0
  lambda_norm: 1.0
  lambda_s2s: 1.0
  lambda_slm: 0.0    # WavLM discriminator crashes — keep 0.0
  lambda_sty: 0.0
model_params:
  decoder:
    gen_istft_hop_size: 5
    gen_istft_n_fft: 20
    resblock_dilation_sizes:
    - - 1
      - 3
      - 5
    - - 1
      - 3
      - 5
    - - 1
      - 3
      - 5
    resblock_kernel_sizes:
    - 3
    - 7
    - 11
    type: istftnet
    upsample_initial_channel: 512
    upsample_kernel_sizes:
    - 20
    - 12
    upsample_rates:
    - 10
    - 6
  diffusion:
    dist:
      estimate_sigma_data: true
      mean: -3.0
      sigma_data: 0.2
      std: 1.0
    embedding_mask_proba: 0.1
    transformer:
      head_features: 64
      multiplier: 2
      num_heads: 8
      num_layers: 3
  dim_in: 64
  dropout: 0.2
  hidden_dim: 512
  max_dur: 50
  multispeaker: true
  n_layer: 3
  n_mels: 80
  n_token: 178
  plbert:
    dropout: 0.1
    hidden_size: 768
    intermediate_size: 2048
    max_position_embeddings: 512
    num_attention_heads: 12
    num_hidden_layers: 12
  slm:
    hidden: 768
    initial_channel: 64
    model: microsoft/wavlm-base-plus
    nlayers: 13
    sr: 16000
  style_dim: 128
  text_encoder_kernel_size: 5
optimizer_params:
  bert_lr: 1.0e-06    # lower than v3 (1e-5) — more stable LM finetuning
  ft_lr: 3.0e-05      # reduced from 1e-4 after NaN collapse at epoch 4
  lr: 3.0e-05         # reduced from 1e-4 after NaN collapse at epoch 4
preprocess_params:
  spect_params:
    fmax: 8000
    fmin: 0
    hop_length: 300
    n_fft: 2048
    n_mels: 80
    win_length: 1200
  sr: 24000
pretrained_model: ''   # empty -> take the first_stage_path branch (v3's working recipe)
save_freq: 1
# false routes loading through first_stage_path, which applies ignore_modules for the
# modules Stage 1 never trained (predictor_encoder/msd/mpd/wd/diffusion). v3 (val 0.506)
# used false; v4's earlier `true` skipped ignore_modules and scored 1.539.
second_stage_load_pretrained: false
slmadv_params:
  batch_percentage: 0.5
  iter: 10
  max_len: 500
  min_len: 100
  scale: 0.01
  sig: 1.5
  thresh: 5
train_LM: false   # freeze BERT — train_LM: true causes LM Loss explosion (23→400+)
